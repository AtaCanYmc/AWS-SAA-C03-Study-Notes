name: "Öneri, Özellik veya Yeni Kaynak Talebi"
description: "Soru bankasına yeni bir özellik, PWA geliştirmesi veya yeni bir çalışma kaynağı önerin."
title: "[Öneri]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Reponun geliştirilmesi için önerilerinizi bekliyoruz!
  - type: input
    id: summary
    attributes:
      label: "Öneri Başlığı"
      placeholder: "Kısa ve açıklayıcı bir başlık"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Önerinin Detayı"
      description: "Nasıl bir fayda sağlayacak? Ne tür bir geliştirme planlanabilir?"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: "Kategori"
      options:
        - "Web Quiz PWA Uygulaması"
        - "Yeni Soru Bankası / Not Ekleme"
        - "CI/CD & Otomasyon"
        - "Dokümantasyon & İçerik Düzenleme"
