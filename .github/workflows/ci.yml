name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Markdown governance files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f LICENSE

      - name: Validate notes directory structure
        run: |
          test -d notes/01-aws-certified-solutions-architect-associate-saa-c03
          test -d notes/02-aws-saa-c03-question-bank-1019
          test -d notes/03-caa-exam-questions-explained
          test -f notes/01-aws-certified-solutions-architect-associate-saa-c03/notes.md
          test -f notes/02-aws-saa-c03-question-bank-1019/notes.md
          test -f notes/03-caa-exam-questions-explained/notes.md
