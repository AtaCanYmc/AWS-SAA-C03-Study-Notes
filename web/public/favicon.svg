<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="favOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA826"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="favCubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB84D"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="favCubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232F3E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="favCubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base for browser tab -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#favBg)" stroke="url(#favOrange)" stroke-width="2.5"/>

  <!-- Centered Hexagon Emblem -->
  <g transform="translate(64, 58)">
    <path d="M 0 -44 L 38 -22 L 38 22 L 0 44 L -38 22 L -38 -22 Z"
          fill="#111827"
          stroke="url(#favOrange)"
          stroke-width="2.5"
          stroke-linejoin="round"/>

    <!-- 3D Isometric Cube -->
    <polygon points="0,-22 20,-11 0,0 -20,-11" fill="url(#favCubeTop)"/>
    <polygon points="-20,-11 0,0 0,22 -20,11" fill="url(#favCubeLeft)" stroke="#334155" stroke-width="0.8"/>
    <polygon points="20,-11 0,0 0,22 20,11" fill="url(#favCubeRight)" stroke="#334155" stroke-width="0.8"/>

    <!-- Cloud in Center -->
    <path d="M -6 5 A 4 4 0 0 1 -2 1 A 6 6 0 0 1 6 2 A 5 5 0 0 1 8 8 L -6 8 Z" fill="#FFFFFF"/>

    <!-- Smile curve -->
    <path d="M -16 27 Q 0 37 16 27" fill="none" stroke="#FF9900" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 17 24 L 18 29 L 13 29 Z" fill="#FF9900"/>

    <!-- 4 Cardinal dots -->
    <circle cx="0" cy="-44" r="2.5" fill="#38BDF8"/>
    <circle cx="38" cy="22" r="2.5" fill="#34D399"/>
    <circle cx="0" cy="44" r="2.5" fill="#FBBF24"/>
    <circle cx="-38" cy="22" r="2.5" fill="#F472B6"/>
  </g>

  <!-- Micro SAA Label -->
  <text x="64" y="116"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="900"
        font-size="10"
        letter-spacing="1.5"
        fill="#FF9900">SAA-C03</text>
</svg>
