<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="50%" stop-color="#101726"/>
      <stop offset="100%" stop-color="#1A233A"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#FF9900" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Emblem Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232F3E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB84D"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>

    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA826"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>

    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.5px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 14px; fill: #94A3B8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1.2px; fill: #FF9900; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #CBD5E1; }
    .stat-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #FF9900; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="226" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="876" height="226" rx="16" fill="url(#grid)"/>
  <rect x="2" y="2" width="876" height="226" rx="16" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Background Decorative Architecture Constellation (Right Side) -->
  <g opacity="0.2" transform="translate(620, 20)">
    <!-- Connected nodes -->
    <line x1="40" y1="50" x2="120" y2="30" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="120" y1="30" x2="190" y2="70" stroke="#38BDF8" stroke-width="1"/>
    <line x1="190" y1="70" x2="150" y2="140" stroke="#FF9900" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="150" y1="140" x2="70" y2="150" stroke="#38BDF8" stroke-width="1"/>
    <line x1="70" y1="150" x2="40" y2="50" stroke="#FF9900" stroke-width="1"/>
    <line x1="120" y1="30" x2="70" y2="150" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>

    <circle cx="40" cy="50" r="4" fill="#38BDF8"/>
    <circle cx="120" cy="30" r="5" fill="#FF9900"/>
    <circle cx="190" cy="70" r="4" fill="#38BDF8"/>
    <circle cx="150" cy="140" r="5" fill="#FF9900"/>
    <circle cx="70" cy="150" r="4" fill="#38BDF8"/>
  </g>

  <!-- LEFT EMBLEM: AWS Architectural Shield -->
  <g transform="translate(112, 115)">
    <!-- Ambient Glow -->
    <circle cx="0" cy="0" r="72" fill="#FF9900" fill-opacity="0.08" filter="url(#glow)"/>

    <!-- Outer Hexagon Badge -->
    <path d="M 0 -64 L 55.4 -32 L 55.4 32 L 0 64 L -55.4 32 L -55.4 -32 Z"
          fill="url(#shieldGrad)"
          stroke="url(#awsOrange)"
          stroke-width="2.5"
          stroke-linejoin="round"/>

    <!-- Inner Hexagon Detail -->
    <path d="M 0 -56 L 48.5 -28 L 48.5 28 L 0 56 L -48.5 28 L -48.5 -28 Z"
          fill="none"
          stroke="#475569"
          stroke-width="1"
          stroke-opacity="0.5"
          stroke-dasharray="4,3"/>

    <!-- Isometric Architecture Cube -->
    <!-- Top Face -->
    <polygon points="0,-32 28,-16 0,0 -28,-16" fill="url(#cubeTop)"/>
    <!-- Left Face -->
    <polygon points="-28,-16 0,0 0,32 -28,16" fill="url(#cubeLeft)" stroke="#334155" stroke-width="0.75"/>
    <!-- Right Face -->
    <polygon points="28,-16 0,0 0,32 28,16" fill="url(#cubeRight)" stroke="#334155" stroke-width="0.75"/>

    <!-- Cube Center Core Symbol: Cloud Outline -->
    <path d="M -9 8 A 5 5 0 0 1 -4 3 A 8 8 0 0 1 7 4 A 6 6 0 0 1 9 12 L -9 12 Z"
          fill="#FFFFFF"
          fill-opacity="0.9"/>

    <!-- AWS Signature Smile Arrow -->
    <path d="M -22 38 Q 0 50 22 38"
          fill="none"
          stroke="#FF9900"
          stroke-width="2.5"
          stroke-linecap="round"/>
    <path d="M 23 35 L 25 40 L 19 40 Z" fill="#FF9900"/>

    <!-- 4 Architectural Domain Orbit Nodes -->
    <!-- Domain 1: Security (Top) -->
    <circle cx="0" cy="-64" r="4.5" fill="#38BDF8" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Domain 2: Resilience (Right) -->
    <circle cx="55.4" cy="32" r="4.5" fill="#34D399" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Domain 3: Performance (Left) -->
    <circle cx="-55.4" cy="32" r="4.5" fill="#F472B6" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Domain 4: Cost (Bottom) -->
    <circle cx="0" cy="64" r="4.5" fill="#FBBF24" stroke="#0F172A" stroke-width="1.5"/>
  </g>

  <!-- CONTENT SECTION (RIGHT OF EMBLEM) -->
  <!-- Top Category Pill -->
  <g transform="translate(205, 34)">
    <rect x="0" y="0" width="265" height="26" rx="13" fill="#FF9900" fill-opacity="0.12" stroke="#FF9900" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#FF9900"/>
    <text x="26" y="17" class="badge-text">AWS CERTIFICATION • SAA-C03</text>
  </g>

  <!-- Main Heading -->
  <text x="205" y="94" class="title">Solutions Architect Associate</text>

  <!-- Subheading -->
  <text x="205" y="124" class="subtitle">Curated Study Notes, Architecture Scenarios &amp; Interactive Question Bank</text>

  <!-- Badges / Feature Chips Row -->
  <g transform="translate(205, 154)">
    <!-- Chip 1: Questions Total -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="145" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <!-- Question mark / check icon -->
      <circle cx="16" cy="16" r="7" fill="#FF9900" fill-opacity="0.2"/>
      <path d="M 13 16 L 15 18 L 19 14" stroke="#FF9900" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="29" y="20" class="tag-text"><tspan class="stat-num">1,766</tspan> Questions</text>
    </g>

    <!-- Chip 2: Dual Language -->
    <g transform="translate(155, 0)">
      <rect x="0" y="0" width="145" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <!-- Globe icon -->
      <circle cx="16" cy="16" r="7" stroke="#38BDF8" stroke-width="1.2" fill="none"/>
      <line x1="9" y1="16" x2="23" y2="16" stroke="#38BDF8" stroke-width="1"/>
      <ellipse cx="16" cy="16" rx="3.5" ry="7" stroke="#38BDF8" stroke-width="1" fill="none"/>
      <text x="29" y="20" class="tag-text">EN / TR Dual Lang</text>
    </g>

    <!-- Chip 3: Quiz PWA -->
    <g transform="translate(310, 0)">
      <rect x="0" y="0" width="135" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <!-- Bolt / Play icon -->
      <polygon points="12,11 21,16 12,21" fill="#34D399"/>
      <text x="27" y="20" class="tag-text">Quiz PWA App</text>
    </g>

    <!-- Chip 4: 4 Domains -->
    <g transform="translate(455, 0)">
      <rect x="0" y="0" width="140" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <!-- Architecture 4 pillars icon -->
      <rect x="11" y="11" width="4" height="10" rx="1" fill="#A78BFA"/>
      <rect x="17" y="11" width="4" height="10" rx="1" fill="#A78BFA"/>
      <text x="27" y="20" class="tag-text">4 Exam Domains</text>
    </g>
  </g>
</svg>
