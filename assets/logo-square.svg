<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1A243B"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="sqBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF9900" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Shield & Emblem Gradients -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232F3E"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB84D"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>

    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAE33"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>

    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base: Squircle with Smooth Rounded Corners -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="url(#sqBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="108" stroke="url(#sqBorder)" stroke-width="3"/>

  <!-- Subtle Radial Ambient Glow behind Shield -->
  <circle cx="256" cy="215" r="140" fill="#FF9900" fill-opacity="0.09" filter="url(#softGlow)"/>

  <!-- ARCHITECTURAL SHIELD (Hexagon) -->
  <g transform="translate(256, 215)">
    <!-- Outer Hexagon -->
    <path d="M 0 -130 L 112.6 -65 L 112.6 65 L 0 130 L -112.6 65 L -112.6 -65 Z"
          fill="url(#shieldFill)"
          stroke="url(#awsOrange)"
          stroke-width="5"
          stroke-linejoin="round"/>

    <!-- Inner Dashed Hexagon Guideline -->
    <path d="M 0 -115 L 99.6 -57.5 L 99.6 57.5 L 0 115 L -99.6 57.5 L -99.6 -57.5 Z"
          fill="none"
          stroke="#475569"
          stroke-width="1.8"
          stroke-opacity="0.5"
          stroke-dasharray="6,4"/>

    <!-- 3D Isometric Architecture Cube -->
    <!-- Top Face -->
    <polygon points="0,-64 56,-32 0,0 -56,-32" fill="url(#cubeTop)"/>
    <!-- Left Face -->
    <polygon points="-56,-32 0,0 0,64 -56,32" fill="url(#cubeLeft)" stroke="#334155" stroke-width="1.5"/>
    <!-- Right Face -->
    <polygon points="56,-32 0,0 0,64 56,32" fill="url(#cubeRight)" stroke="#334155" stroke-width="1.5"/>

    <!-- Central Cloud Silhouette -->
    <path d="M -18 16 A 10 10 0 0 1 -8 6 A 16 16 0 0 1 14 8 A 12 12 0 0 1 18 24 L -18 24 Z"
          fill="#FFFFFF"
          fill-opacity="0.95"/>

    <!-- AWS Signature Smile Arrow -->
    <path d="M -46 76 Q 0 102 46 76"
          fill="none"
          stroke="#FF9900"
          stroke-width="5"
          stroke-linecap="round"/>
    <path d="M 48 70 L 52 82 L 40 82 Z" fill="#FF9900"/>

    <!-- 4 Cardinal Exam Domain Indicator Nodes -->
    <!-- Security (Top) -->
    <circle cx="0" cy="-130" r="8" fill="#38BDF8" stroke="#0F172A" stroke-width="2.5"/>
    <!-- Resilience (Right) -->
    <circle cx="112.6" cy="65" r="8" fill="#34D399" stroke="#0F172A" stroke-width="2.5"/>
    <!-- Cost (Bottom) -->
    <circle cx="0" cy="130" r="8" fill="#FBBF24" stroke="#0F172A" stroke-width="2.5"/>
    <!-- Performance (Left) -->
    <circle cx="-112.6" cy="65" r="8" fill="#F472B6" stroke="#0F172A" stroke-width="2.5"/>
  </g>

  <!-- BOTTOM SAA-C03 BADGE PILL -->
  <g transform="translate(256, 420)">
    <rect x="-115" y="-22" width="230" height="44" rx="22"
          fill="url(#awsOrange)"
          stroke="#FFFFFF"
          stroke-width="1.5"
          stroke-opacity="0.3"/>
    <text x="0" y="7"
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-weight="900"
          font-size="20"
          letter-spacing="2.5"
          fill="#0A0E17">SAA-C03</text>
  </g>
</svg>
